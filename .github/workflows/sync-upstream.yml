name: Sync upstream

on:
  schedule:
    # Every day at 03:17 UTC. GitHub may delay scheduled runs.
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-upstream.yml'

# No PAT or extra repository secret is required.
permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    # Do not run this fork-specific writer in upstream or in another fork.
    if: github.repository == 'YuSaZh/NikonFirmwarePatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPOSITORY: XinmiaoZhao/NikonFirmwarePatch
          TARGET_BRANCH: main
        shell: bash
        run: |
          set -euo pipefail

          # Use GitHub's fork relationship, and fail closed if it ever changes.
          upstream=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.parent.full_name')
          if [[ "$upstream" != "$UPSTREAM_REPOSITORY" ]]; then
            echo "::error::Unexpected upstream repository: $upstream"
            exit 1
          fi

          # The official sync API preserves fork-only commits. A conflicting
          # merge fails instead of resetting, rebasing, or force-pushing main.
          if ! gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch="$TARGET_BRANCH" \
            --jq '"\(.merge_type): \(.message)"' \
            > "$RUNNER_TEMP/upstream-sync-result.txt"; then
            echo '::error::Upstream sync failed. Inspect the API error above. Resolve conflicts manually; upstream workflow edits may require a manual sync because GITHUB_TOKEN cannot grant workflows permission. No force update was attempted.'
            exit 1
          fi

          {
            echo '## Upstream sync'
            echo
            echo "Source: $UPSTREAM_REPOSITORY ($TARGET_BRANCH)"
            echo "Destination: $GITHUB_REPOSITORY ($TARGET_BRANCH)"
            echo
            cat "$RUNNER_TEMP/upstream-sync-result.txt"
          } | tee -a "$GITHUB_STEP_SUMMARY"

# This syncs branch history only, not tags, releases, or release assets.
# Upstream workflow edits may be rejected by GITHUB_TOKEN; sync those manually.
# GitHub can disable public-repository schedules after 60 days of inactivity.
# Re-enable this workflow in Actions if that happens; manual runs are available.
